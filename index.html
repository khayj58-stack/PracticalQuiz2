<!DOCTYPE html>
<html>
  <head>
    <title>A-Frame Indoor Kitchen Assessment</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene shadow="type: pcfsoft">
      
      <a-sky color="#87CEEB"></a-sky>

      <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#7BC8A4"></a-plane> 
      <a-plane position="0 4 0" rotation="90 0 0" width="12" height="12" color="#FFFFFF"></a-plane> 
      <a-plane position="0 2 -6" width="12" height="4" color="#F5F5DC"></a-plane> 
      <a-plane position="-6 2 0" rotation="0 90 0" width="12" height="4" color="#F5F5DC"></a-plane> 
      <a-plane position="6 2 0" rotation="0 -90 0" width="12" height="4" color="#F5F5DC"></a-plane> 

      <a-box position="0 2.2 -5.95" width="3" height="1.8" depth="0.1" color="#ADD8E6" material="opacity: 0.4; transparent: true"></a-box>
      <a-box position="0 3.1 -5.9" width="3.2" height="0.1" depth="0.15" color="#5D2906"></a-box>
      <a-box position="0 1.3 -5.9" width="3.2" height="0.1" depth="0.15" color="#5D2906"></a-box>

      <a-box position="-2 3.98 -2" width="1" height="0.05" depth="1" color="#FFF" material="emissive: #FFF; emissiveIntensity: 0.5"></a-box>
      <a-box position="2 3.98 -2" width="1" height="0.05" depth="1" color="#FFF" material="emissive: #FFF; emissiveIntensity: 0.5"></a-box>
      <a-box position="-2 3.98 2" width="1" height="0.05" depth="1" color="#FFF" material="emissive: #FFF; emissiveIntensity: 0.5"></a-box>
      <a-box position="2 3.98 2" width="1" height="0.05" depth="1" color="#FFF" material="emissive: #FFF; emissiveIntensity: 0.5"></a-box>

      <a-entity id="main-table" position="0 0 0">
        <a-box position="0 0.75 0" width="2.2" height="0.08" depth="1.4" color="#8B4513"></a-box>
        <a-cylinder position="-1 0.35 -0.6" radius="0.04" height="0.7" color="#442200"></a-cylinder>
        <a-cylinder position="1 0.35 -0.6" radius="0.04" height="0.7" color="#442200"></a-cylinder>
        <a-cylinder position="-1 0.35 0.6" radius="0.04" height="0.7" color="#442200"></a-cylinder>
        <a-cylinder position="1 0.35 0.6" radius="0.04" height="0.7" color="#442200"></a-cylinder>
      </a-entity>

      <a-entity id="chair1" position="0 0 1.2">
        <a-box position="0 0.45 0" width="0.6" height="0.05" depth="0.6" color="#555"></a-box>
        <a-box position="0 0.9 0.28" width="0.6" height="0.9" depth="0.05" color="#555"></a-box>
        <a-box position="-0.25 0.2 0.25" width="0.04" height="0.4" depth="0.04" color="#222"></a-box>
        <a-box position="0.25 0.2 0.25" width="0.04" height="0.4" depth="0.04" color="#222"></a-box>
      </a-entity>

      <a-entity id="chair2" position="0 0 -1.2" rotation="0 180 0">
        <a-box position="0 0.45 0" width="0.6" height="0.05" depth="0.6" color="#555"></a-box>
        <a-box position="0 0.9 0.28" width="0.6" height="0.9" depth="0.05" color="#555"></a-box>
        <a-box position="-0.25 0.2 0.25" width="0.04" height="0.4" depth="0.04" color="#222"></a-box>
        <a-box position="0.25 0.2 0.25" width="0.04" height="0.4" depth="0.04" color="#222"></a-box>
      </a-entity>

      <a-entity position="0 0.79 0">
        <a-cylinder position="-0.4 0.2 0" radius="0.12" height="0.4" color="#006400"></a-cylinder> <a-text value="MILO" position="-0.52 0.2 0.13" scale="0.25 0.25 0.25" color="yellow"></a-text>
        
        <a-cylinder position="0.4 0.15 0" radius="0.13" height="0.3" color="#FFFFFF"></a-cylinder> <a-text value="MILK" position="0.28 0.15 0.14" scale="0.2 0.2 0.2" color="blue"></a-text>

        <a-cylinder position="0 0.1 0.4" radius="0.07" height="0.18" color="#E57373"></a-cylinder> <a-cylinder position="0 0.1 -0.4" radius="0.07" height="0.18" color="#64B5F6"></a-cylinder> </a-entity>

      <a-light type="ambient" intensity="0.5"></a-light>
      <a-light type="point" intensity="0.8" position="0 3.5 0"></a-light>
      
      <a-entity position="0 1.6 4">
        <a-camera></a-camera>
      </a-entity>

    </a-scene>
  </body>
</html>
